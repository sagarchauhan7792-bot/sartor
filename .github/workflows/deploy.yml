name: Build check

# The app is published to the Revnox site repo (sagarchauhan7792-bot/index)
# under /dress, and served from https://www.revnoxmedia.com/dress/. GitHub's
# own Pages deployment API is not used: it repeatedly failed to complete inside
# the 10-minute ceiling actions/deploy-pages enforces.
#
# So this workflow only proves the branch builds. To publish, run:
#   npm run build   and copy dist/ into the index repo's dress/ folder.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
