name: Deploy to GitHub Pages

# Publishes the built site to the gh-pages branch rather than going through
# actions/deploy-pages. That action caps its wait at 10 minutes and cancels the
# deployment for the commit when it expires — which, while the Pages deployment
# API is slow, makes it impossible to ship at all. Serving from a branch avoids
# that API completely.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Publish dist to gh-pages
        run: |
          cd dist
          # stop Pages running the output through Jekyll
          touch .nojekyll
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${GITHUB_SHA}"
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
